# Render.com blueprint. In Render: New + > Blueprint > pick this repo. Set ANTHROPIC_API_KEY when prompted.
services:
  - type: web
    name: csp-trainer
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: anthropic
      - key: MODEL
        value: claude-opus-5-5
      - key: DB_PATH
        value: /tmp/trainer.db
